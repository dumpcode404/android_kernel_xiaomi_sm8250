name: Kernel Build (Munch)

on:
  workflow_dispatch:
  push:
    paths:
      - 'arch/arm64/configs/vendor/munch_defconfig'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev \
            ccache cpio zip python3 curl git

      - name: Setup Neutron clang
        run: |
          mkdir -p $HOME/neutron && cd $HOME/neutron
          bash <(curl -s https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman) -S
          echo "$HOME/neutron/bin" >> $GITHUB_PATH
      - name: Setup KernelSU
        run: |
          echo "=== Setup KernelSU ==="

          curl -LSs https://raw.githubusercontent.com/backslashxx/KernelSU/master/kernel/setup.sh | bash -

          echo "=== Verify KernelSU ==="
          grep -R "KernelSU" -n drivers 2>/dev/null | head || true
  
      - name: Generate defconfig
        run: make O=out ARCH=arm64 vendor/munch_defconfig

      - name: Build
        run: |
          make -j$(nproc) O=out ARCH=arm64 \
            CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- 2>&1 | tee build.log

      - name: Package AnyKernel3
        run: |
          B=out/arch/arm64/boot
          Q=$B/dts/vendor/qcom

          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak3
          git clone --depth=1 https://android.googlesource.com/platform/system/libufdt libufdt

          # dtbo.img dari overlay munch
          python3 libufdt/utils/src/mkdtboimg.py create ak3/dtbo.img --page_size=4096 $Q/munch-*.dtbo

          # dtb gabungan
          cat $Q/kona.dtb $Q/kona-v2.dtb $Q/kona-v2.1.dtb > ak3/dtb
          cp $B/Image ak3/Image

          cat > ak3/anykernel.sh << 'AKEOF'
          ### AnyKernel3 Ramdisk Mod Script
          properties() { '
          kernel.string=Custom Kernel for POCO F4 (munch)
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=munch
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          BLOCK=boot;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          dump_boot;
          write_boot;

          flash_generic dtbo;
          AKEOF

          cd ak3
          rm -rf .git README.md
          zip -r9 ../Munch-Kernel-$(date +%Y%m%d-%H%M).zip . -x '*.git*'

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: munch-kernel
          if-no-files-found: warn
          path: |
            build.log
            Munch-Kernel-*.zip
